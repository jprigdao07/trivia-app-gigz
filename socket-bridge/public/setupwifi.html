<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <title>Setup Wi-Fi</title>

</head>
<body>

    <!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <h2>🎮 Gigz</h2>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>

    <!-- <a href="setupwifi.html" class="nav-item"><i>📶</i> <b>Setup Wi-Fi</b></a> -->

    <div class="navbar-links" id="navbarLinks">
      <a href="http://192.168.1.77:8080/gigz.html#dashboard" class="nav-item" id="dashboardLink"><i>🏠</i> Dashboard</a>
      <!-- <a href="#" class="nav-item" data-target="rounds"><i>🎯</i>Navigation</a>
      <a href="#" class="nav-item" data-target="scoreboard"><i>🏆</i> Scoreboard</a>
      <a href="#" class="nav-item" data-target="settings"><i>⚙️</i> Settings</a> -->
      
    </div>
  </nav>

<div id="provisioning" class="provisioning" style="display: none;">

     <h1>Wi-Fi Provisioning</h1>

    <div class="ssid-wrapper">
        <input type="text" id="ssid" placeholder="Wi-Fi SSID" required/>
    </div>

    <div class="password-wrapper">
        <input type="password" id="password" placeholder="Wi-Fi Password" required />
        <span id="togglePassword" class="eye-btn">👁️</span>
    </div>

  <button id="provisionBtn">Connect</button>
</div>

<div id="status"></div>

<!-- Add this button somewhere -->
<button id="openProvisioningBtn" class="wifiBtn">Setup Wi-Fi</button>

<button id="goToQuizBtn" class="quizBtn" style="display:none;">
  Go to Quiz
</button>
</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Optional: change icon
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("openProvisioningBtn");
      const panel = document.getElementById("provisioning");

  if (btn && panel) {
    btn.addEventListener("click", () => {
      panel.style.display = "flex";
      btn.style.display = "none"; // optional
    });
  } else {
    console.error("Missing elements:", { btn, panel });
  }
});

const goBtn = document.getElementById("goToQuizBtn");
if (goBtn) {
  goBtn.addEventListener("click", () => {
    window.location.href = "http://192.168.1.77:8080/gigz.html#rounds";
  });
}


const dashboardBtn = document.getElementById("dashboardLink");

if (dashboardBtn) {
  dashboardBtn.addEventListener("click", (e) => {
    e.preventDefault();

    window.location.href =
      "http://192.168.1.77:8080/gigz.html#dashboard";
  });
}
</script>


<!-- ✅ Load Socket.IO client BEFORE using io() -->
<script src="http://192.168.1.77:8080/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<script src="app.js"></script>
    
</body>
</html>
