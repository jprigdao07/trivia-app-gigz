<head>

  <style>
    .screen {

      height: auto;
      margin: auto;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    .screen h1, p{
      color: aliceblue;
      margin-bottom: 5px;
    }

    .logo {
      font-size: 2.2em;
      font-weight: bold;
      margin-bottom: 10px;
      color: aliceblue;
    }

    .subtitle {
      font-size: 1em;
      opacity: 0.8;
      margin-bottom: 25px;
      color: aliceblue;
    }

    .email {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    .ver-otp{
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-code {
      width: 100%;
      font-size: 18px;
      padding: 15px;
      cursor: pointer;
      border-radius: 10px;
      margin-bottom: 1rem;
      color: #ffffff;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
    }

    .btn-verify {
      width: 100%;  
      font-size: 18px;
      padding: 15px;
      cursor: pointer;
      border-radius: 10px;
      margin-bottom: 1rem;
      color: #ffffff;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
    }

    button:hover {
      background-color: #4226b8;
    }

    .footer {
      color: aliceblue;
      margin-top: 20px;
      font-size: 0.9em;
      opacity: 0.7;
    }
    .skip{
      display: flex;
    }
    .skip-btn {
        display: inline-block;
        margin: auto;
        margin-bottom: 5rem;
        padding: 10px 22px;

        background: transparent;
        color: #ffffff;

        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;

        font-size: 14px;
        font-weight: 500;

        text-decoration: none;
        cursor: pointer;

        transition: all 0.2s ease;
    }

    .skip-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #ffffff;
        color: #ffffff;
    }

    .skip-btn:active {
        transform: scale(0.97);
    }

    .brand-header{
        margin: auto;
        height: 10px;
        color: aliceblue;
    }
    .brand-header p{
        color: rgb(156, 158, 158);
        margin-top: 20px;

    }

<body>


    <!-- Main -->
<div class="main">

  <div class="brand-header">

    <h1>Welcome to Gigz</h1>
    <p>Set up your host device to get started.</p>
  </div>

 <!-- =========================
       LOGIN SECTION
  ========================== -->
  <div id="loginSection" class="screen">

    <!-- <div class="logo">GIGZ</div> -->

    <img src="5star_host.png" alt="" width="180px">

    <div class="subtitle">Sign in to continue</div>

    <input type="text" id="username" class="email" placeholder="Enter your phone or email" />

    <button id="loginBtn" class="btn-code">Send Code</button>

    <div class="footer">Powered by Five★Host</div>
  </div>


  <!-- =========================
       OTP SECTION
  ========================== -->
  <div id="verifySection" class="screen" style="display: none;">

    <h1>OTP Verification</h1>

    <p>
      Please enter the 6-digit code sent to your email or phone.
    </p>

    <input type="text" id="otp" class="ver-otp" placeholder="Enter OTP" maxlength="6"
    style="text-align:center; font-size:20px; letter-spacing:5px;" />

    <button id="verifyBtn" class="btn-verify">
      Verify
    </button>

  </div>

<div id="provisioning" class="provisioning" style="display: none;">

     <h1>Wi-Fi Provisioning</h1>

    <div class="ssid-wrapper">
        <input type="text" id="ssid" placeholder="Wi-Fi SSID" required/>
    </div>

    <div class="password-wrapper">
        <input type="password" id="password" placeholder="Wi-Fi Password" required />
        <span id="togglePassword" class="eye-btn">👁️</span>
    </div>

  <button id="provisionBtn">Connect</button>
</div>

<div id="status"></div>

<!-- Add this button somewhere -->
<button id="openProvisioningBtn" class="wifiBtn">Setup Wi-Fi</button>

<div class="skip">
  <a href="http://192.168.1.77:8080/gigz.html#dashboard" class="skip-btn" id="skipDashboardBtn" style="display: none;">Skip>>></a>
</div>

<button id="goToQuizBtn" class="quizBtn" style="display:none;">
  Go to Quiz
</button>
</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Optional: change icon
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("openProvisioningBtn");
      const panel = document.getElementById("provisioning");

  if (btn && panel) {
    btn.addEventListener("click", () => {
      panel.style.display = "flex";
      btn.style.display = "none"; // optional
    });
  } else {
    console.error("Missing elements:", { btn, panel });
  }
});

const goBtn = document.getElementById("goToQuizBtn");
if (goBtn) {
  goBtn.addEventListener("click", () => {
    window.location.href = "http://192.168.1.77:8080/gigz.html#rounds";
  });
}


const dashboardBtn = document.getElementById("dashboardLink");

if (dashboardBtn) {
  dashboardBtn.addEventListener("click", (e) => {
    e.preventDefault();

    window.location.href =
      "http://192.168.1.77:8080/gigz.html#dashboard";
  });
}
</script>


<script>
  document.addEventListener("DOMContentLoaded", () => {

    // ========================================
    // GET ELEMENTS
    // ========================================

    const loginSection =
      document.getElementById("loginSection");

    const verifySection =
      document.getElementById("verifySection");

    const loginBtn =
      document.getElementById("loginBtn");

    const verifyBtn =
      document.getElementById("verifyBtn");

    const setupWifiBtn =
      document.getElementById("openProvisioningBtn");

    const provisioning =
      document.getElementById("provisioning");

    const skipDashboardBtn = document.getElementById("skipDashboardBtn");


    // ========================================
    // INITIAL STATE
    // ========================================

    // Login is displayed initially
    loginSection.style.display = "block";

    // OTP is hidden initially
    verifySection.style.display = "none";

    // Setup Wi-Fi button is hidden initially
    setupWifiBtn.style.display = "none";

    // Wi-Fi provisioning is hidden initially
    provisioning.style.display = "none";


    // ========================================
    // LOGIN
    // ========================================

    loginBtn.addEventListener("click", () => {

      const user =
        document.getElementById("username").value.trim();

      if (!user) {
        alert("Please enter your email or phone.");
        return;
      }

      // Store the user temporarily
      localStorage.setItem("pendingUser", user);
      localStorage.setItem("loginStarted", "true");

      // Hide login
      loginSection.style.display = "none";

      // Show OTP
      verifySection.style.display = "block";

    });


    // ========================================
    // OTP VERIFICATION
    // ========================================

    verifyBtn.addEventListener("click", () => {

      const otp =
        document.getElementById("otp").value.trim();

      if (otp.length !== 6) {
        alert("Please enter a valid 6-digit code.");
        return;
      }

      // Simulated OTP verification
      alert("✅ OTP verified successfully!");

      // Mark host as authenticated
      localStorage.setItem("hostLoggedIn", "true");

      // Remove temporary login state
      localStorage.removeItem("loginStarted");

      // Hide OTP
      verifySection.style.display = "none";

      // Show Setup Wi-Fi button
      setupWifiBtn.style.display = "block";


      // Show Skip button
      skipDashboardBtn.style.display = "inline-block";

    });

    // ========================================
    // SETUP WI-FI BUTTON
    // ========================================

    setupWifiBtn.addEventListener("click", () => {

      // Hide Setup Wi-Fi button
      setupWifiBtn.style.display = "none";

      // Show Wi-Fi provisioning form
      provisioning.style.display = "flex"; 

    });

  });
</script>

<!-- ✅ Load Socket.IO client BEFORE using io() -->
<script src="http://192.168.1.77:8080/socket.io/socket.io.js"></script>
