
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | 5 Star Trivia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --background: #080d1b;
      --card: #111a2e;
      --border: #26334c;
      --text: #f4f7ff;
      --muted: #9ba9c2;
      --accent: #6978ff;
      --accent-hover: #8290ff;
    }

    body {
      background: url('trivia-app.PNG') no-repeat center center fixed;
      background-size: cover;
      background-attachment: fixed no;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* background: linear-gradient(135deg, #2c3e50, #4ca1af); */
      color: white;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }
    /* body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #192650 0%, transparent 55%),
        var(--background);
    } */

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      display: block;
      width: 150px;
      max-width: 65%;
      height: auto;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    .brand h1 {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.7px;
      margin-bottom: 9px;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .login-card {
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17, 26, 46, 0.96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      opacity: 70%;
    }

    .card-heading {
      margin-bottom: 26px;
    }

    .card-heading h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .card-heading p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: #0b1325;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #71809b;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(105, 120, 255, 0.15);
    }

    .password-input {
      padding-right: 76px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #aab7d0;
      font-size: 12px;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: white;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 24px;
      font-size: 12px;
    }

    .remember-option {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .remember-option input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot-link {
      color: #a5b0ff;
      text-decoration: none;
    }

    .forgot-link:hover {
      color: white;
      text-decoration: underline;
    }

    .sign-in-button {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .sign-in-button:hover {
      background: var(--accent-hover);
    }

    .sign-in-button:active {
      transform: scale(0.99);
    }

    .sign-in-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffb4b4;
      background: rgba(220, 53, 69, 0.12);
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .message.info {
      display: block;
      color: #c4ceff;
      background: rgba(105, 120, 255, 0.1);
      border: 1px solid rgba(105, 120, 255, 0.25);
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #7887a3;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 25px 21px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
    
.create-account-prompt {
  margin-top: 20px;
  text-align: center;
}

.create-account-prompt p {
  display: inline;
  margin: 0;
  font-size: 14px;
}

.create-account-prompt a {
  margin-left: 5px;
  color: #2563eb;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
}

.create-account-prompt a:hover {
  text-decoration: underline;
}

  </style>
</head>

<body>
  <main class="login-wrapper">
    <header class="brand">
      <img
        src="/logo_gradient.png"
        alt="5 Star Trivia logo"
        onerror="this.style.display='none'"
      >

      <h1>Welcome Back</h1>
      <p>Sign in to manage your trivia experience.</p>
    </header>

    <section class="login-card">
      <div class="card-heading">
        <h2>Sign in to your account</h2>
        <p>Enter your account credentials to continue.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username or email"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            >Show</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-option" for="rememberMe">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
            >
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot-link" id="forgotPassword">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="sign-in-button" id="signInButton">
          Sign In
        </button>

        <div
          id="loginMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>
      </form>
      
      <div class="create-account-prompt">
        <p>Don't have an account?</p>
        <a href="/create-account.html">Create Account</a>
      </div>

    </section>

    <footer class="footer">
      &copy; <span id="currentYear"></span> 5 Star Trivia.
      All rights reserved.
    </footer>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    togglePassword.addEventListener("click", () => {
      const showPassword = passwordInput.type === "password";

      passwordInput.type = showPassword ? "text" : "password";
      togglePassword.textContent = showPassword ? "Hide" : "Show";
      togglePassword.setAttribute("aria-pressed", String(showPassword));
      togglePassword.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );
    });


    loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = passwordInput.value;
    const signInButton = document.getElementById("signInButton");

    loginMessage.className = "message";
    loginMessage.textContent = "";

    signInButton.disabled = true;
    signInButton.textContent = "Signing in...";

    try {
        const response = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username,
            password
        })
        });

        const result = await response.json();

        if (!response.ok) {
        throw new Error(
            result.message || "Unable to sign in. Please check your credentials."
        );
        }

        window.location.replace("/dashboard.html");
    } catch (error) {
        loginMessage.className = "message error";
        loginMessage.textContent =
        error.message === "Failed to fetch"
            ? "Unable to connect to the server. Please try again."
            : error.message;
    } finally {
        signInButton.disabled = false;
        signInButton.textContent = "Sign In";
    }
    });

  </script>
</body>
</html>
