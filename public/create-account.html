
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | 5 Star Trivia</title>

    <style>
    * {
      box-sizing: border-box;
    }
    
    :root {
      color-scheme: dark;
      --background: #080d1b;
      --card: #111a2e;
      --border: #26334c;
      --text: #f4f7ff;
      --muted: #9ba9c2;
      --accent: #6978ff;
      --accent-hover: #8290ff;
    }

    body {
      background: url('trivia-app.PNG') no-repeat center center fixed;
      background-size: cover;
      background-attachment: fixed no;
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      /* background: #f4f6fb;
      color: #1f2937; */
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      display: block;
      width: 90px;
      height: auto;
      margin: 0 auto 16px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      color: #f8f9fa;
    }

    .brand p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17, 26, 46, 0.96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      opacity: 70%;
    }

    .card-heading {
      margin-bottom: 26px;
      text-align: center;
    }

    .card-heading h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      color: #f0f2f4;
    }

    .card-heading p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .form-group input {
      display: block;
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #111827;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-group label{
        color: #d1d5db;
    }

    .sign-in-button {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
    }

    .sign-in-button:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }

    .sign-in-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message:empty {
      display: none;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #15803d;
    }

    .create-account-prompt {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .create-account-prompt p {
      display: inline;
      margin: 0;
      font-size: 14px;
      color: #64748b;
    }

    .create-account-prompt a {
      margin-left: 5px;
      color: #2563eb;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .create-account-prompt a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-wrapper {
        padding: 24px 16px;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand h1 {
        font-size: 25px;
      }

      .login-card {
        padding: 26px 22px;
        border-radius: 12px;
      }

      .card-heading h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="login-wrapper">
    <header class="brand">
      <img
        src="/logo_gradient.png"
        alt="5 Star Trivia logo"
        onerror="this.style.display='none'"
      >
<!-- 
      <h1>Create Account</h1>
      <p>Create an account to access the Quiz App.</p> -->
    </header>

    <section class="login-card">
      <div class="card-heading">
        <h2>Register your account</h2>
        <p>Enter your details below to get started.</p>
      </div>

      <form id="createAccountForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            autocomplete="username"
            minlength="3"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            maxlength="255"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
          >
        </div>

        <button
          type="submit"
          class="sign-in-button"
          id="createAccountButton"
        >
          Create Account
        </button>

        <div
          id="createAccountMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <div class="create-account-prompt">
        <p>Already have an account?</p>
        <a href="/login.html">Sign In</a>
      </div>
    </section>

    <footer class="footer">
      &copy; <span id="currentYear"></span> 5 Star Trivia.
      All rights reserved.
    </footer>
  </main>

<script>
  document.getElementById("currentYear").textContent =
    new Date().getFullYear();

  const createAccountForm = document.getElementById("createAccountForm");
  const createAccountButton = document.getElementById("createAccountButton");
  const createAccountMessage = document.getElementById("createAccountMessage");

  createAccountForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    createAccountMessage.textContent = "";
    createAccountMessage.className = "message";

    if (password !== confirmPassword) {
      createAccountMessage.textContent = "Passwords do not match.";
      createAccountMessage.classList.add("error");
      return;
    }

    createAccountButton.disabled = true;
    createAccountButton.textContent = "Creating Account...";

    try {
      const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
          username,
          email,
          password,
          confirmPassword
        })
      });

      const data = await response.json();

      if (!response.ok) {
        createAccountMessage.textContent =
          data.message || "Unable to create your account.";

        createAccountMessage.classList.add("error");
        return;
      }

      createAccountMessage.textContent =
        "Account created successfully! Redirecting to sign in...";

      createAccountMessage.classList.add("success");

      createAccountForm.reset();

      setTimeout(() => {
        window.location.href = "/login.html";
      }, 1500);

    } catch (error) {
      console.error("Registration error:", error);

      createAccountMessage.textContent =
        "Unable to connect to the server. Please try again.";

      createAccountMessage.classList.add("error");

    } finally {
      createAccountButton.disabled = false;
      createAccountButton.textContent = "Create Account";
    }
  });
</script>
</body>
</html>
