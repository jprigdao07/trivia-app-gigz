<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("enterFullScreen");

  // User clicks once → enter fullscreen
  btn.addEventListener("click", () => {
    const el = document.getElementById("rightBox") || document.body;
    el.requestFullscreen().catch(err => console.error("Fullscreen failed:", err));
    btn.style.display = "none";
    window.SBCFullscreenActive = true;
    localStorage.setItem("SBCFullscreenActive", "1");
  });

  // Auto-hide button if fullscreen was already activated
  if (localStorage.getItem("SBCFullscreenActive")) {
    btn.style.display = "none";
    window.SBCFullscreenActive = true;
  }
});
</script>

  try {

    return new Date(data.scheduledStart).getTime();
  } catch (err) {
    console.error("❌ Failed to fetch scheduled start time:", err);

  }

// =============================================
// 🔐 GENERATE QUIZ DATA HASH
// =============================================
function generateQuizHash(quizData) {

  const data = JSON.stringify(quizData);

  let hash = 0;

  for (let i = 0; i < data.length; i++) {
    const char = data.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }

  return Math.abs(hash).toString(16);
}

function millisecondsUntilMidnight() {

    const now = new Date();

    const midnight = new Date(now);

    midnight.setHours(24, 0, 0, 0);

    return midnight - now;

}

function scheduleMidnightCleanup() {

    const uploadedQuiz = localStorage.getItem("uploadedQuiz");
    if (!uploadedQuiz) return;

    const quiz = JSON.parse(uploadedQuiz);

    const now = new Date();
    const uploadDate = new Date(quiz.uploadedAt);

    const cleanupTime = new Date(uploadDate);
    cleanupTime.setHours(24, 0, 0, 0);

    if (now >= cleanupTime) {
        cleanupUploadedQuiz();
        return;
    }

    const delay = cleanupTime - now;

    console.log(
        `🕛 Cleanup scheduled in ${Math.round(delay / 1000)} seconds`
    );

    setTimeout(cleanupUploadedQuiz, delay);
}

<script>
/********* Load Quiz Details on Click *********/
async function onQuizClick(quizId) {
  try {
    if (!quizId) return alert("Invalid quiz selected.");

    // 1️⃣ Fetch quiz details
    const res = await fetch(`http://192.168.1.77:4001/api/quiz/${quizId}`);


    // Handle finished quiz specifically
    if (!res.ok) {
      let errorData = {};

      try {
        errorData = await res.json();
      } catch {
        // Response was not JSON
      }

      if (
        res.status === 409 ||
        errorData?.code === "QUIZ_FINISHED" ||
        errorData?.status === "finished"
      ) {
        console.log(
          `🛑 Quiz ${quizId} is finished and cannot be reused automatically.`
        );

        alert(
          "This quiz has already been completed and is currently unavailable for reuse."
        );

        return;
      }

      throw new Error(
        errorData?.message || `Failed to load quiz: ${res.status} ${res.statusText}`
      );
    }

    let quizDetails = await res.json();
    if (!quizDetails.game) throw new Error("Quiz missing 'game' object");
    let { game } = quizDetails;


    // =============================================
    // 🛑 PREVENT REUSE OF FINISHED QUIZ
    // =============================================
    if (game.status?.toLowerCase() === "finished") {

      console.log(
        `🛑 Quiz ${quizId} is finished and cannot be reused automatically.`
      );

      alert(
        "This quiz has already been completed and is currently unavailable for reuse."
      );

      return;
    }

    // 2️⃣ Activate if inactive
    if (game.status !== "active") {
      const activateRes = await fetch(`http://192.168.1.77:4001/api/quiz/${quizId}/activate`, { method: "PATCH" });
      if (!activateRes.ok) throw new Error("Failed to activate quiz");
      const activateData = await activateRes.json();
      game = activateData.game;
    }

    // 3️⃣ Ensure scheduled_start_at
    if (!game.scheduled_start_at) {
      const scheduledStart = new Date(Date.now() + 5 * 60 * 1000).toISOString();
      await fetch(`http://192.168.1.77:4001/api/quiz/${quizId}/set-scheduled-start`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scheduledStart })
      });
      game.scheduled_start_at = scheduledStart;
    }

    // 4️⃣ Update globals
    window.currentGameId = game.id;
    localStorage.setItem("currentGameId", game.id);
    window.activeScheduledStart = game.scheduled_start_at;

    // 5️⃣ Trigger countdown via socket
    if (window.socket && window.socket.connected) {
      window.socket.emit("controller:start_countdown", {
        gameId: game.id,
        scheduledStart: game.scheduled_start_at
      });
    }

    // 6️⃣ Trigger backend bridge (optional)
    fetch("http://192.168.1.77:8080/api/start-countdown", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gameId: game.id, scheduledStart: game.scheduled_start_at })
    }).catch(err => console.error("⚠️ Failed to trigger countdown:", err));

    // 7️⃣ Load in-place for SBC/TV (fullscreen-safe)
    const isSBC = window.innerWidth >= 1200; // adjust threshold if needed
    if (isSBC && typeof loadQuizById === "function") {
      console.log("📺 SBC/TV mode: loading quiz in-place, keeping fullscreen");
      loadQuizById(game.id);

      // Reapply fullscreen after DOM updates
      setTimeout(() => {
        if (typeof startTVMode === "function") startTVMode();
      }, 100);

    } else {
      console.log("💻 Desktop/laptop: navigating normally");
      if (typeof window.reactNavigateToCountdown === "function") {
        window.reactNavigateToCountdown(game.id);
      } else {
        window.location.href = `/quizzes_tab.html#/countdown?gameId=${game.id}&scheduledStart=${encodeURIComponent(game.scheduled_start_at)}`;
      }
    }

  } catch (err) {
    console.error("❌ Failed to load quiz:", err);
    alert("Failed to load quiz. Check console.");
  }
}

  // 🔹 Utility to extract a round number from a round object
  function getRoundNumber(round, fallbackIndex) {
    if (!round?.title) return fallbackIndex + 1;

    // Music rounds (e.g. "Music Round 6")
    const musicMatch = round.title.match(/Music Round (\d+)/i);
    if (musicMatch) return parseInt(musicMatch[1], 10);

    // Movie round (sometimes called "Name That Movie")
    if (/Movie Round|Name That Movie/i.test(round.title)) return 15;

    // Generic "Round X"
    const genericMatch = round.title.match(/Round (\d+)/i);
    if (genericMatch) return parseInt(genericMatch[1], 10);

    // Fallback: just use array index
    return fallbackIndex + 1;
  }

  // 🔹 Render table WITHOUT answers (newly generated quizzes)
  function renderQuizTableNoAnswers(rounds) {
    if (!Array.isArray(rounds)) return;

    const tbody = document.getElementById('questionsTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    // ✅ Sort rounds by extracted round number
    const sortedRounds = [...rounds].sort((a, b) =>
      getRoundNumber(a, 0) - getRoundNumber(b, 0)
    );

    sortedRounds.forEach((round, roundIndex) => {
      const questions = Array.isArray(round.questions) ? round.questions : [];
      const seen = new Set();

      questions.filter(q => {
        const text = q.questionText || q.question || q.text || '';
        if (!text.trim() || seen.has(text)) return false;
        seen.add(text);
        return true;
      }).forEach((q, questionIndex) => {

// 🔹 Render table WITH answers (used quizzes)
function renderQuizTableWithAnswers(rounds) {
  if (!Array.isArray(rounds)) return;

  const tbody = document.getElementById('questionsTableBody');
  if (!tbody) return;
  tbody.innerHTML = '';

  const globalSeen = new Set();

  // Normalize rounds/questions
  const normalizedRounds = rounds.map(round => ({
    ...round,
    questions: (round.questions || []).map(q => ({
        id: q.id || q.question_id || q.raw_id, 
      questionText: q.questionText || q.question || q.text || q.question_text || '',
      correctAnswer:
        q.correctAnswer ??
        q.correct_answer ??
        q.answer ??
        (Array.isArray(q.answers) ? (q.answers.find(a => a.isCorrect)?.text || 'N/A') : 'N/A'),
      raw: q
    }))
  }));

  // Sort rounds by round_number
  const sortedRounds = [...normalizedRounds].sort(
    (a, b) => (a.round_number || 0) - (b.round_number || 0)
  );

  // Render each round
  sortedRounds.forEach((round, roundIndex) => {
    const questions = round.questions || [];

    questions
      .filter(q => {
        const text = (q.questionText || '').trim();
        if (!text || globalSeen.has(text)) return false;
        globalSeen.add(text);
        return true;
      })
      .forEach((q, questionIndex) => {
        const tr = document.createElement('tr');

        // Round number
        const tdRoundNumber = document.createElement('td');
        tdRoundNumber.textContent = `Round ${round.round_number || roundIndex + 1}`;
        tdRoundNumber.style.color = '#853b81';
        tdRoundNumber.style.padding = '10px';
        tdRoundNumber.style.border = '1px solid #ccc';

        // Category / Round title
        const tdRoundTitle = document.createElement('td');
        tdRoundTitle.textContent = round.category || '';
        tdRoundTitle.style.color = '#03adcf';
        tdRoundTitle.style.padding = '10px';
        tdRoundTitle.style.border = '1px solid #ccc';

        // Question
        const tdQuestion = document.createElement('td');
        tdQuestion.textContent = q.questionText;
        tdQuestion.style.padding = '10px';
        tdQuestion.style.border = '1px solid #ccc';

        // Answer
        const tdAnswer = document.createElement('td');
        tdAnswer.textContent = q.correctAnswer;
        tdAnswer.style.padding = '10px';
        tdAnswer.style.border = '1px solid #ccc';

        // Actions
        const tdActions = document.createElement('td');
        tdActions.innerHTML = `
          <button class="action-button" onclick="openEditModal(${roundIndex}, ${questionIndex})">
            <i class="fas fa-edit"></i>
          </button>
          <button class="action-button-red" onclick="deleteQuestion(${q.id})">
            <i class="fas fa-trash-alt"></i>
          </button>
          <button class="action-button-blue" onclick="openAddModal(${roundIndex})">
            <i class="fas fa-plus"></i>
          </button>
        `;
        tdActions.style.padding = '10px';
        tdActions.style.border = '1px solid #ccc';

        // Append all columns
        tr.appendChild(tdRoundNumber);
        tr.appendChild(tdRoundTitle);
        tr.appendChild(tdQuestion);
        tr.appendChild(tdAnswer);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });

    // If a round has no questions, show an empty row
    if (questions.length === 0) {
      const tr = document.createElement('tr');
      const tdEmpty = document.createElement('td');
      // tdEmpty.colSpan = 5;
      // tdEmpty.textContent = 'No questions yet';
      tdEmpty.style.textAlign = 'center';
      tdEmpty.style.padding = '10px';
      tr.appendChild(tdEmpty);
      tbody.appendChild(tr);
    }
  });
}

// Open Edit Question Modal
function openEditModal(roundIndex, questionIndex) {
  const question = window._allRounds?.[roundIndex]?.questions?.[questionIndex];
  if (!question || !question.id) return alert("This question cannot be edited yet.");

  currentEditRoundIndex = roundIndex;
  currentEditIndex = questionIndex;
  currentModalType = 'edit';

  document.getElementById('editInput').value =
    question.text || question.question || question.questionText || '';

  document.getElementById('editAnswerInput').value =
    question.correct_answer ?? question.correctAnswer ?? question.answer ?? '';

  document.getElementById('editModal').style.display = 'block';
}

// Close both modals
function closeModal() {
  document.querySelectorAll(".modal").forEach(m => m.style.display = 'none');
  currentModalType = null;
  currentEditRoundIndex = null;
  currentEditIndex = null;
}

// Save Add or Edit
function saveQuestion() {
  const value = (currentModalType === 'edit') 
    ? document.getElementById('editInput').value.trim() 
    : document.getElementById('addInput').value.trim();

  const answerValue = (currentModalType === 'edit') 
    ? document.getElementById('editAnswerInput').value.trim()
    : document.getElementById('addAnswerInput').value.trim();

  if (!value || !answerValue) {
    alert("Both question and answer are required.");
    return;
  }

  // 🟢 EDIT
  if (currentModalType === 'edit') {
    const question = window._allRounds[currentEditRoundIndex].questions[currentEditIndex];
    if (!question || !question.id) {
      alert("Invalid question reference.");
      return;
    }

    window.currentEditingQuestion = question;

    const isQuizQuestion = question.source === "quiz";
    const url = isQuizQuestion
      ? `http://192.168.1.77:4001/update-quiz-question/${question.id}`
      : `http://192.168.1.77:4001/update-question/${question.id}`;

    fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: question.id,
        question_text: value,
        correct_answer: answerValue,
        wrong_answer: question.wrong ? question.wrong.join(",") : "",
        tags: question.tags || "",
        multiple_choice: question.type === "mc" ? 1 : 0
      })
    })
      .then(async res => {
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      })
      .then(() => {
        question.questionText = value;
        question.correctAnswer = answerValue;
        question.correct_answer = answerValue;

        renderQuizTableWithAnswers(window._allRounds);
        closeModal();
      })
      .catch(err => {
        console.error("❌ Edit failed:", err);
        alert("Failed to update question. See console for details.");
      });

// 🟢 ADD
} else if (currentModalType === 'add') {
  const round = window._allRounds[currentEditRoundIndex] || {};

  const gameId = window.gameId || window.currentGameId;
  if (!gameId) {
    alert("Missing game ID — cannot save question.");
    return;
  }

  // ✅ Try both round_db_id and id fallback
  const roundId = round.round_db_id || round.id;
  if (!roundId) {
    alert("Missing round ID — cannot save question.");
    return;
  }

  const payload = {
    game_id: gameId,
    round_id: roundId,     
    round_number: round.roundId || round.round_number,
    question_text: value,
    correct_answer: answerValue,
    wrong_answer: "",
    tags: "",
    multiple_choice: 0
  };

  fetch(`http://192.168.1.77:4001/api/quiz-questions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(async res => {
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    })
    .then(newQ => {
      if (!window._allRounds[currentEditRoundIndex]) {
        window._allRounds[currentEditRoundIndex] = { questions: [] };
      }
      window._allRounds[currentEditRoundIndex].questions.push({
        id: newQ.id,
        questionText: newQ.question_text,
        correctAnswer: newQ.correct_answer,
        correct_answer: newQ.correct_answer,
        wrong: newQ.wrong_answer ? newQ.wrong_answer.split(",") : [],
        tags: newQ.tags || "",
        source: "quiz"
      });
      renderQuizTableWithAnswers(window._allRounds);
      closeModal();

       window.location.reload();
    })
    .catch(err => {
      console.error("❌ Add failed:", err);
      alert("Failed to add question. See console for details.");
    });
}
}

// Delete Question
function deleteQuestion(roundIndex, questionIndex) {
  const question = window._allRounds?.[roundIndex]?.questions?.[questionIndex];
  if (!question || !question.id) return;

  if (!confirm("Are you sure you want to delete this question?")) return;

  fetch(`http://192.168.1.77:4001/api/questions/${question.id}`, { method: 'DELETE' })
    .then(async res => {
      if (!res.ok) throw new Error(await res.text());
      window._allRounds[roundIndex].questions.splice(questionIndex, 1);
      renderFullQuiz(window._allRounds);
    })
    .catch(err => {
      console.error('Delete failed:', err);
      alert("Failed to delete question. See console for details.");
    });
}

  }
</script>

<script>

// 🔍 Search
async function searchQuestions() {
  const query = document.getElementById("searchQuestions").value.trim();

  if (!query) {
    // Show full round again
    renderQuizTableWithAnswers(window._currentRound, window.selectedQuizId);
    return;
  }

  try {
    const res = await fetch(
      `http://192.168.1.77:4001/api/quiz-questions?search=${encodeURIComponent(query)}`
    );
    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      console.warn("🔍 No valid questions found.");
      renderQuizTableWithAnswers([], window.selectedQuizId);
      return;
    }

    // 🔹 Transform DB rows into our expected format
    const transformedQuestions = data.map(q => {
      let options = [];
      try {
        options = JSON.parse(q.multiple_choice || "[]");
      } catch {
        options = [];
      }

      return {
        id: q.id,
        round_id: q.round_id,                    
        category: q.category || "Uncategorized",   
        text: q.question_text,
        type: options.length ? "mc" : "text",
        options,
        correct_answer: q.correct_answer,
        wrong_answer: q.wrong_answer,
        tags: q.tags || []
      };
    });

    // 🔹 Group results by round_id + category instead of "Search Results"
    const groupedByRound = Object.values(
      transformedQuestions.reduce((acc, q) => {
        const key = `${q.round_id}-${q.category}`;
        if (!acc[key]) {
          acc[key] = {
            round_number: q.round_id,
            category: q.category,
            questions: []
          };
        }
        acc[key].questions.push(q);
        return acc;
      }, {})
    );

    renderQuizTableWithAnswers(groupedByRound, window.selectedQuizId);

  } catch (error) {
    console.error("❌ Search failed:", error);
  }
}

// Delete Question
function deleteQuestion(questionId) {
  if (!confirm("Are you sure you want to delete this question?")) return;

  fetch(`/api/delete-question-api/${questionId}`, { method: "DELETE" })
    .then(res => {
      if (!res.ok) throw new Error(`Delete failed. Status: ${res.status}`);
      return res.json();
    })
    .then(data => {
      console.log("✅ Deleted:", data);
      alert("Question deleted successfully");
      refreshAll();
    })
    .catch(err => {
      console.error("❌ Delete failed:", err);
      alert("Failed to delete question. See console for details.");
    });
}

<script>
function isSBC() {
    return new URLSearchParams(window.location.search).get("device") === "sbc";
}

function getRightBox() {
    return document.getElementById("rightBox");
}

function ensureFullscreen() {
    if (!isSBC()) return;

    const rightBox = getRightBox();
    if (!rightBox) return;

    if (document.fullscreenElement) return;

    rightBox.requestFullscreen().catch(err => {
        console.warn("Fullscreen request failed:", err);
    });
}

function startTVMode() {
    if (!isSBC()) return;

    const rightBox = getRightBox();
    if (!rightBox) return;

    document.body.classList.add("tv-mode");
    rightBox.classList.add("tv-mode");

    ensureFullscreen();
}

function observeQuizContent() {
    const quizRoot = document.getElementById("quizPreviewRoot");
    if (!quizRoot) return;

    const observer = new MutationObserver(() => {
        // Do not immediately request fullscreen on every DOM mutation.
        // Only make sure the TV classes remain applied.
        if (isSBC()) {
            document.body.classList.add("tv-mode");

            const rightBox = getRightBox();
            if (rightBox) {
                rightBox.classList.add("tv-mode");
            }
        }
    });

    observer.observe(quizRoot, {
        childList: true,
        subtree: true
    });
}

function onNewQuizSelected() {
    if (!isSBC()) return;

    const quizRoot = document.getElementById("quizPreviewRoot");
    if (!quizRoot) return;

    const checkReady = setInterval(() => {
        if (quizRoot.children.length > 0) {
            clearInterval(checkReady);

            startTVMode();
        }
    }, 100);
}

window.addEventListener("load", () => {
    if (!isSBC()) return;

    startTVMode();
    observeQuizContent();

    if (window.socket) {
        window.socket.on("controller:selected_quiz", () => {
            onNewQuizSelected();
        });
    }
});

window.addEventListener("quiz:navigate", () => {
    if (isSBC()) {
        startTVMode();
    }
});

document.addEventListener("fullscreenchange", () => {
    if (isSBC() && !document.fullscreenElement) {
        // Give the browser a moment before attempting to restore fullscreen.
        setTimeout(() => {
            ensureFullscreen();
        }, 300);
    }
});
</script>
