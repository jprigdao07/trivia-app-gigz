<script>
(function () {

  // Detect TV-mode only if query param is present AND running on SBC
  function isTVDevice() {
    const params = new URLSearchParams(window.location.search);
    const tvParam = params.get("tv") === "true";

    // Optional: detect SBC by checking OS / user agent / hostname
    // Example using hostname (change 'orangepi' to your SBC hostname)
    const hostname = window.location.hostname;
    const isSBC = hostname.includes("192.168.1.77"); // IP of SBC or host check

    return tvParam && isSBC;
  }

  if (isTVDevice()) {
    document.documentElement.classList.add("tv-mode");
  }

})();
</script>
